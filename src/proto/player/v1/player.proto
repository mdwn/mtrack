syntax = "proto3";

package player.v1;

import "google/protobuf/duration.proto";

// BeatGrid contains beat positions and measure boundaries detected from
// a click track. Used for snapping loop points to musically meaningful positions.
message BeatGrid {
    // Absolute time in seconds of each detected beat.
    repeated double beats = 1;
    // Indices into beats that mark measure boundaries (accented beats).
    repeated uint32 measure_starts = 2;
}

// Section defines a named region of a song by measure boundaries.
message Section {
    // Display name for this section.
    string name = 1;
    // Start measure (1-indexed, inclusive).
    uint32 start_measure = 2;
    // End measure (1-indexed, exclusive).
    uint32 end_measure = 3;
    // Beat within start_measure (1-based, fractional allowed). Absent means
    // the measure line. A boundary is only measure-accurate without this, and
    // the player resolves it through the beat grid, so a client that ignores
    // these draws the section somewhere the player does not agree with.
    optional double start_beat = 4;
    // Beat within end_measure (1-based, fractional allowed). Absent means the
    // measure line, keeping the bound exclusive.
    optional double end_beat = 5;
    // Display colour for timelines ("#rrggbb"); absent means the client picks.
    optional string color = 6;
}

// Song is a message that contains information about a song.
message Song {
    reserved 4;
    reserved "is_transcoded";

    // Name is the name of the song.
    string name = 1;

    // Duration is the length of the song.
    google.protobuf.Duration duration = 2;

    // Tracks are the tracks available for the song.
    repeated string tracks = 3;

    // Beat grid derived from click track analysis.
    BeatGrid beat_grid = 5;

    // Named sections defined by measure boundaries.
    repeated Section sections = 6;
}

// PlayRequest is the message for requesting the player to play the current song.
message PlayRequest {}

// PlayResponse is the response message after playing a song.
message PlayResponse {
    // Song is the song that is now playing.
    Song song = 1;
}

// PreviousRequest is the message for requesting the player to move to the previous
// song.
message PreviousRequest {}

// PreviousResponse is the response message after moving to the previous song.
message PreviousResponse {
    // Song is the song the playlist is now pointing at.
    Song song = 1;
}

// NextRequest is the message for requesting the player to move to the next
// song.
message NextRequest {}

// NextResponse is the response message after moving to the next song.
message NextResponse {
    // Song is the song the playlist is now pointing at.
    Song song = 1;
}

// NavigateToSongRequest is the message for making an entry of the active
// playlist the current one without playing it.
message NavigateToSongRequest {
    // The index of the entry in the active playlist, as GetPlaylist lists
    // them. A song listed twice is reached at either entry.
    uint32 position = 1;
    // The name of the song the caller believes is at that entry. When set and
    // the entry holds another song, the playlist has changed under the
    // caller and nothing moves.
    string song_name = 2;
}

// NavigateToSongResponse is the response message after the playlist moved.
message NavigateToSongResponse {
    // Song is the song the playlist is now pointing at. While a song plays
    // the playlist does not move, and this is the song playing. When the
    // playlist is already on that entry nothing changes: no pause is called
    // off, no waiting auto-play cancelled, no song-change announced.
    Song song = 1;
}

// StopRequest is the message for requesting the player to stop the currently
// playing song.
message StopRequest {}

// StopResponse is the response message after requesting the player to stop.
message StopResponse {
    // Song is the song that was stopped.
    Song song = 1;
}

// SwitchToPlaylistRequest is the message for requesting the player to switch
// to a different playlist.
message SwitchToPlaylistRequest {
    // PlaylistName is the name of the playlist to switch to.
    string playlist_name = 1;
}

// SwitchToPlaylistResponse is the response message after requesting the player
// to switch to a different playlist.
message SwitchToPlaylistResponse {}

// StatusRequest is the message for requesting a streaming status from the player.
message StatusRequest {}

// StatusResponse is the response message after requesting the status from the player.
message StatusResponse {
    // PlaylistName is the name of the current playlist.
    string playlist_name = 1;

    // CurrentSong is the current song that the current playlist is pointing to.
    Song current_song = 2;

    // Playing is true while a song is playing.
    bool playing = 3;

    // Elapsed is the amount of time that has elapsed while playing the song.
    google.protobuf.Duration elapsed = 4;

    // AudioHealth is what the audio output is actually doing. Absent when no
    // audio device is open, or when the device cannot report.
    //
    // Carried alongside playback state rather than in its own RPC because the
    // two are only interpretable together: silence is correct when nothing is
    // playing, so "playing = true, writing_signal = false" is the diagnostic,
    // and splitting them would make a remote monitor correlate two calls.
    optional AudioHealth audio_health = 5;

    // Ambient is ambient light's mode and what it is doing. Absent without
    // a DMX engine.
    optional AmbientStatus ambient = 6;

    // AutoPlay is the song waiting to start by itself (its playlist entry's
    // auto_play gap running). Absent when none is.
    optional AutoPlayStatus auto_play = 7;
}

// AmbientStatus is ambient light's mode and what it is doing.
message AmbientStatus {
    // Mode is "auto", "on" or "off".
    string mode = 1;

    // State is "playing", "pending" (waiting out its delay), "off", or
    // "unavailable" (mode on with no show to play: none configured, or it
    // does not load).
    string state = 2;

    // Show is the ambient show file, when there is one to play.
    optional string show = 3;

    // Source is whose settings the show plays, when there is one: "profile",
    // "playlist", or "entry" (the playlist entry the player waits on).
    optional string source = 4;

    // Available is false when the status's read of the DMX engine did not
    // answer in time, or failed; mode and state are then empty, and reason
    // says why. Absent when the read answered.
    optional bool available = 5;

    // Reason is why there is nothing to report, when available is false.
    optional string reason = 6;
}

// AutoPlayStatus is a song waiting to start by itself.
message AutoPlayStatus {
    // Song is the name of the song waiting.
    string song = 1;

    // StartsIn is how long until it starts.
    google.protobuf.Duration starts_in = 2;
}

// SetAmbientModeRequest sets ambient light's mode. The mode is not saved:
// the player starts in "auto".
message SetAmbientModeRequest {
    // Mode is "auto" (between songs, after its delay), "on" (now, over any
    // song, until auto again) or "off" (none; ambient playing fades out).
    string mode = 1;
}

// SetAmbientModeResponse is returned after setting the ambient mode.
message SetAmbientModeResponse {
    // Ambient is ambient light's mode and state after the change. Absent
    // without a DMX engine.
    optional AmbientStatus ambient = 1;
}

// CancelAutoPlayRequest calls off an auto play waiting to start.
message CancelAutoPlayRequest {}

// CancelAutoPlayResponse is returned after cancelling an auto play.
message CancelAutoPlayResponse {
    // Cancelled is true when an auto play was waiting and is now called off.
    bool cancelled = 1;
}

// AudioHealth reports what the audio output callback is doing, as distinct from
// whether a device was opened. A device handle exists from the moment one is
// found, and keeps existing while the interface is physically unplugged.
message AudioHealth {
    // Status is one of "healthy", "recovering", "stalled" or "never_started".
    //
    // A string rather than an enum so there is one vocabulary across gRPC, the
    // JSON status endpoint and the web UI, which switches on these exact names.
    string status = 1;

    // CallbackAlive is true when the output callback has run recently. False
    // means the stream is open but not producing.
    bool callback_alive = 2;

    // WritingSignal is true when non-silent audio was handed to the device
    // recently. False is normal and expected whenever nothing is playing.
    bool writing_signal = 3;

    // Recoveries counts output streams rebuilt after a backend error. A rig
    // recovering from a flaky cable several times a set looks healthy at any
    // single instant; this is the only thing that shows it.
    uint64 recoveries = 4;

    // Underruns counts buffer underruns reported by the backend. Routine and
    // self-healing; a rising count means the buffer is too small for the
    // machine, not that anything has failed.
    uint64 underruns = 5;

    // LastError is the most recent backend error, retained after recovery.
    optional string last_error = 6;
}

// PlayFromRequest is the message for requesting the player to play from a specific time.
message PlayFromRequest {
    // StartTime is the time to start playback from, as a Duration (the CLI
    // takes "1:23.456" or "45.5s" and sends it as one). If not provided or
    // zero, plays from the beginning.
    google.protobuf.Duration start_time = 1;
}

// PlaySongFromRequest is the message for requesting the player to play a specific song
// from a specific time.
message PlaySongFromRequest {
    // SongName is the name of the song to play.
    string song_name = 1;
    // StartTime is the time to start playback from.
    google.protobuf.Duration start_time = 2;
}

// SeekRequest is the message for seeking to a position within the current song.
message SeekRequest {
    // Position is the absolute position to seek to within the current song.
    google.protobuf.Duration position = 1;
}

// SeekResponse is returned after a seek.
message SeekResponse {}

// SeekToSectionRequest is the message for seeking to the start of a named section.
message SeekToSectionRequest {
    // SectionName is the name of the section to seek to.
    string section_name = 1;
}

// GetCuesRequest is the message for requesting the list of cues in the current song.
message GetCuesRequest {}

// Cue represents a single cue in the lighting timeline.
message Cue {
    // Time is the time at which this cue triggers.
    google.protobuf.Duration time = 1;
    // Index is the index of this cue in the timeline.
    uint32 index = 2;
}

// GetCuesResponse is the response containing the list of cues.
message GetCuesResponse {
    // Cues is the list of cues in the current song's lighting timeline.
    repeated Cue cues = 1;
}

// GetActiveEffectsRequest is the message for requesting active lighting effects.
message GetActiveEffectsRequest {}

// GetActiveEffectsResponse is the response containing active lighting effects information.
message GetActiveEffectsResponse {
    // ActiveEffects is a formatted string listing all active lighting effects.
    string active_effects = 1;
}

// StopSamplesRequest is the message for requesting the player to stop all triggered samples.
message StopSamplesRequest {}

// StopSamplesResponse is the response message after stopping triggered samples.
message StopSamplesResponse {}

// GetConfigRequest is the message for requesting the current configuration.
message GetConfigRequest {}

// GetConfigResponse is the response containing the current configuration.
message GetConfigResponse {
    // The full configuration as a YAML string.
    string yaml = 1;
    // Checksum of the current configuration for optimistic concurrency.
    string checksum = 2;
}

// UpdateAudioRequest is the message for updating the audio configuration.
message UpdateAudioRequest {
    // The audio configuration as a JSON string.
    string audio_json = 1;
    // Expected checksum for optimistic concurrency.
    string expected_checksum = 2;
}

// UpdateMidiRequest is the message for updating the MIDI configuration.
message UpdateMidiRequest {
    // The MIDI configuration as a JSON string.
    string midi_json = 1;
    // Expected checksum for optimistic concurrency.
    string expected_checksum = 2;
}

// UpdateDmxRequest is the message for updating the DMX configuration.
message UpdateDmxRequest {
    // The DMX configuration as a JSON string.
    string dmx_json = 1;
    // Expected checksum for optimistic concurrency.
    string expected_checksum = 2;
}

// UpdateControllersRequest is the message for updating the controllers configuration.
message UpdateControllersRequest {
    // The controllers configuration as a JSON string (array).
    string controllers_json = 1;
    // Expected checksum for optimistic concurrency.
    string expected_checksum = 2;
}

// AddProfileRequest is the message for adding a new profile.
message AddProfileRequest {
    // The profile as a JSON string.
    string profile_json = 1;
    // Expected checksum for optimistic concurrency.
    string expected_checksum = 2;
}

// UpdateProfileRequest is the message for updating a profile at a specific index.
message UpdateProfileRequest {
    // The index of the profile to update.
    uint32 index = 1;
    // The profile as a JSON string.
    string profile_json = 2;
    // Expected checksum for optimistic concurrency.
    string expected_checksum = 3;
}

// RemoveProfileRequest is the message for removing a profile at a specific index.
message RemoveProfileRequest {
    // The index of the profile to remove.
    uint32 index = 1;
    // Expected checksum for optimistic concurrency.
    string expected_checksum = 2;
}

// UpdateConfigResponse is the response after a configuration mutation.
message UpdateConfigResponse {
    // The full configuration as a YAML string after the update.
    string yaml = 1;
    // New checksum after the update.
    string checksum = 2;
    // Whether the change has been applied to the running hardware. False
    // when it was saved but the hardware reload waits for the player to be
    // idle: a song playing, paused or fading out.
    bool applied = 3;
    // Why the change has not been applied yet, when it has not.
    string message = 4;
}

// LoopSectionRequest activates section looping for a named section.
message LoopSectionRequest {
    // The name of the section to loop.
    string section_name = 1;
}

// LoopSectionResponse is returned after activating a section loop.
message LoopSectionResponse {}

// StopSectionLoopRequest deactivates section looping.
message StopSectionLoopRequest {}

// StopSectionLoopResponse is returned after stopping a section loop.
message StopSectionLoopResponse {}

// SectionAckRequest acknowledges the current section in reactive looping mode.
message SectionAckRequest {}

// SectionAckResponse is returned after acknowledging a section.
message SectionAckResponse {}

// TrackGain is the gain of a single output track.
message TrackGain {
    // The output track name (a track_mappings key).
    string track = 1;
    // The gain in dB, in [-60, +12]. -60 and below mutes the track.
    double gain_db = 2;
    // Whether the track is currently muted (independently of the gain).
    bool muted = 3;
}

// SetTrackGainRequest sets the gain of a single output track.
message SetTrackGainRequest {
    // The output track name (a track_mappings key).
    string track = 1;
    // The gain in dB. Values outside [-60, +12] are clamped; -60 and below
    // mutes the track.
    double gain_db = 2;
}

// SetTrackGainResponse is returned after setting a track gain.
message SetTrackGainResponse {
    // The applied gain in dB after clamping.
    double applied_gain_db = 1;
}

// SetTrackMuteRequest mutes or unmutes a single output track without
// changing its gain. Mute state is runtime-only and never persisted.
message SetTrackMuteRequest {
    // The output track name (a track_mappings key).
    string track = 1;
    // True to mute, false to unmute.
    bool muted = 2;
}

// SetTrackMuteResponse is returned after setting a track mute.
message SetTrackMuteResponse {
    // The applied mute state.
    bool muted = 1;
}

// GetTrackGainsRequest requests the gains of all output tracks.
message GetTrackGainsRequest {}

// GetTrackGainsResponse contains the gains of all output tracks.
message GetTrackGainsResponse {
    // The gains of all output tracks.
    repeated TrackGain gains = 1;
}

// ListPlaylistsRequest is the message for listing the player's playlists.
message ListPlaylistsRequest {}

// ListPlaylistsResponse names the player's playlists.
message ListPlaylistsResponse {
    // The playlists' names, sorted.
    repeated string names = 1;
    // The name of the active playlist, as StatusResponse reports it.
    string active = 2;
}

// GetPlaylistRequest is the message for reading one playlist's songs.
message GetPlaylistRequest {
    // The playlist's name. Empty means the active playlist.
    string name = 1;
}

// PlaylistEntry is one entry of a playlist: its song, without the song's
// beat grid and sections.
message PlaylistEntry {
    // The song's name.
    string song_name = 1;
    // How long the song plays. Absent for a song the player cannot load.
    google.protobuf.Duration duration = 2;
    // The entry's own settings, as the playlist file has them. Always
    // present, and empty for an entry with none; absent only from a player
    // from before settings could be read, whose GetPlaylistResponse has no
    // revision either.
    EntrySettings settings = 3;
}

// EntrySettings are a playlist entry's transitions and ambient light, as
// the playlist file has them. Each is absent when the entry does not set
// it.
message EntrySettings {
    // How the song fades out when Play, Next or Previous leaves it while it
    // loops: it plays on under the next song.
    Fade fade_out = 1;
    // How the song fades in when it starts under a song fading out.
    Fade fade_in = 2;
    // Whether the song starts by itself when the playlist reaches it.
    // Absent: it waits for Play.
    AutoPlay auto_play = 3;
    // Ambient light in the gap before the song. Absent: the playlist's.
    AmbientSetting ambient = 4;
}

// Fade is a fade as a playlist file has it. Lengths are the player's own
// strings ("3s", "500ms", "6beats", "1measure", "0s" for none), which it
// checks when they are saved.
message Fade {
    // The fade's length.
    string length = 1;
    // "equal_power" or "linear". Absent: equal power.
    optional string curve = 2;
    // The tracks that do not fade. Absent: the default (on a fade-out the
    // song's loop_crossfade_cut tracks, on a fade-in none); present and
    // empty: none.
    TrackNames exclude = 3;
    // On a fade-out only: how long the lights take to cross into the next
    // song's show. Absent: the fade's length.
    optional string lights = 4;
}

// TrackNames is a list of a song's tracks, which may be present and empty.
message TrackNames {
    repeated string names = 1;
}

// AutoPlay is an entry's auto play, when it has one.
message AutoPlay {
    // The gap before the song starts, as the player writes it ("2s",
    // "1500ms"). Empty: at once.
    string gap = 1;
}

// AmbientSetting is ambient light set on a playlist or an entry. Absent,
// it is left to the level above: an entry's to its playlist's, a
// playlist's to the player's profile.
message AmbientSetting {
    // False: no ambient light (the file's `ambient: false`). True: ambient
    // light, the settings below overriding the level above's one by one.
    bool on = 1;
    // The .light file to play, relative to the project.
    optional string show = 2;
    // How long the last song's frame holds before ambient fades in.
    optional string delay = 3;
    // How long ambient takes to fade in.
    optional string fade_in = 4;
    // How long ambient takes to cross into a song's show.
    optional string fade_out = 5;
}

// GetPlaylistResponse lists a playlist's entries in order.
message GetPlaylistResponse {
    // The playlist's name.
    string name = 1;
    // The playlist's entries, in playing order.
    repeated PlaylistEntry entries = 2;
    // The index of the entry the playlist is on. Absent while the song
    // playing is one an edit took off the list.
    optional uint32 position = 3;
    // The playlist's own ambient light. Absent: the profile's.
    AmbientSetting ambient = 4;
    // A short fingerprint of the songs and every setting above. Sent back
    // as SavePlaylistRequest.expected_revision, it has a save refused when
    // the playlist changed since it was read. Empty from a player from
    // before settings could be read.
    string revision = 5;
}

// SavePlaylistRequest replaces the songs of a playlist, or makes one.
message SavePlaylistRequest {
    // The playlist's name. The player's own all_songs is refused.
    string name = 1;
    // The whole list of songs, in order. An existing playlist keeps each
    // entry's own settings (fades, auto play, ambient) with its song, and
    // its playlist-level settings.
    repeated string songs = 2;
    // The songs the caller last saw, in order. Checked only when
    // check_expected is set: when the playlist on the player differs, the
    // save is refused with FAILED_PRECONDITION, as someone else edited it.
    repeated string expected = 3;
    // Whether to check expected. A separate flag because an empty expected
    // cannot be told from an absent one, and an empty playlist is a legal
    // thing to have seen.
    bool check_expected = 4;
    // Refuse with ALREADY_EXISTS when the playlist exists. When unset, a
    // playlist that does not exist is NOT_FOUND.
    bool create = 5;
    // Each song's settings, one per song in songs and in that order. Used
    // only with set_settings; without it each entry keeps the settings it
    // had, with its song.
    repeated EntrySettings settings = 6;
    // Whether to set the entries' settings from settings.
    bool set_settings = 7;
    // The playlist's own ambient light; absent leaves it to the profile.
    // Used only with set_ambient; without it the playlist keeps its own.
    AmbientSetting ambient = 8;
    // Whether to set the playlist's ambient light from ambient.
    bool set_ambient = 9;
    // The revision GetPlaylist answered when the caller read the playlist.
    // When check_expected is set and this is not empty, it is checked
    // beside expected: the save is refused with FAILED_PRECONDITION when
    // the playlist on the player, songs or settings, is not the one read.
    string expected_revision = 10;
}

// ListLightShowsRequest asks for the light shows an ambient light can play.
message ListLightShowsRequest {}

// ListLightShowsResponse names the player's .light files.
message ListLightShowsResponse {
    // Each file's path relative to the project, as an ambient show is
    // written; sorted.
    repeated string paths = 1;
}

// ListSongsRequest asks for a page of the player's song library.
message ListSongsRequest {
    // The index to start from: 0 for the first page, else the `next` of the
    // page before.
    uint32 start = 1;
}

// SongListing is one song of the library, as a list shows it.
message SongListing {
    // The song's name.
    string name = 1;
    // How long the song plays. Absent for a song that failed to load.
    google.protobuf.Duration duration = 2;
    // Whether the song loops (loop_playback).
    bool loops = 3;
    // Whether the song has light shows.
    bool has_lighting = 4;
    // Whether the song plays a MIDI file.
    bool has_midi = 5;
    // Whether the song has samples of its own.
    bool has_samples = 6;
    // Why the song failed to load. Absent for a song that loaded.
    optional string failure = 7;
    // The song's directory relative to the songs directory, "/" between
    // its parts, as the web UI's song list has it (base_dir): "Encore" for
    // a song in a folder of its own at the top, "Live/2026/Encore" for one
    // two folders down. Empty when the song is not under the songs
    // directory. A list groups songs by the part before the last "/".
    // Absent from a player from before it was sent: read as the top.
    optional string base_dir = 8;
}

// ListSongsResponse is a page of the library: every song, loaded or not,
// sorted by name, as many as fit one Bluetooth message.
message ListSongsResponse {
    repeated SongListing songs = 1;
    // Present when there are more: ask again with start set to it.
    optional uint32 next = 2;
    // How many songs the library has, on every page.
    uint32 total = 3;
}

// GetSongRequest names the song to read.
message GetSongRequest {
    string name = 1;
}

// SongLooping is how a song loops, as its file has it.
message SongLooping {
    // Whether the song repeats when it ends.
    bool loop_playback = 1;
    // How long passes overlap, as written ("6s", "2measures"). Empty: none,
    // passes back to back. The player checks it when it is saved.
    string crossfade = 2;
    // The tracks that switch over at the crossfade's midpoint instead of
    // fading (loop_crossfade_cut).
    repeated string cut = 3;
}

// SongTrack is one of a song's audio tracks.
message SongTrack {
    // The track's name, which routes it to an output.
    string name = 1;
    // Its audio file, relative to the song's directory, as written.
    string file = 2;
    // The channel of the file it plays, from 1. Absent: the file's only one.
    optional uint32 file_channel = 3;
}

// SongTracks is a song's whole track list, in order.
message SongTracks {
    repeated SongTrack tracks = 1;
}

// SampleVelocity is how a sample answers velocity. Read only: an update
// leaves a sample's velocity as its file has it.
message SampleVelocity {
    // "ignore", "scale" or "layers".
    string mode = 1;
    // The velocity it plays at when it ignores the trigger's. Absent: 100.
    optional uint32 default_velocity = 2;
    // How many velocity layers it has.
    uint32 layers = 3;
    // Whether layers are also scaled by velocity.
    bool scale = 4;
}

// SongSample is one of a song's own sample definitions.
message SongSample {
    // The sample's name, which its triggers name.
    string name = 1;
    // In an update: the name the sample had when it was read, for one kept
    // or renamed; empty for a new one. GetSong sets it to name.
    string original_name = 2;
    // Its audio file, relative to the song's directory. Absent for a
    // sample that plays velocity layers only.
    optional string file = 3;
    // The output channels it plays on, from 1.
    repeated uint32 output_channels = 4;
    // The track mapping it plays on, over output_channels.
    optional string output_track = 5;
    // "play_to_completion", "stop" or "fade". Empty: play_to_completion.
    string release_behavior = 6;
    // "cut" or "polyphonic". Empty: cut.
    string retrigger = 7;
    // The most voices it plays at once. Absent: the global limit only.
    optional uint32 max_voices = 8;
    // The fade on a release or a cut, in milliseconds. Absent: 50.
    optional uint32 fade_time_ms = 9;
    // How it answers velocity: reported, and ignored in an update.
    SampleVelocity velocity = 10;
}

// SongSamples is a song's whole list of its own samples.
message SongSamples {
    repeated SongSample samples = 1;
}

// SongTrigger is a MIDI event that plays one of the song's samples. Read
// only.
message SongTrigger {
    // The event, in words ("Note On, channel 10, key 36").
    string event = 1;
    // The sample it plays.
    string sample = 2;
}

// SongFile is an audio file in a song's directory.
message SongFile {
    // Its name, as a track's file names it.
    string name = 1;
    // How many channels it has; 0 when it could not be read.
    uint32 channels = 2;
}

// SongOverview is what a song has that GetSong reports but
// UpdateSongSettings does not change.
message SongOverview {
    // Its tempo map, in words ("120 bpm, 4/4, 2 changes"). Absent: none.
    optional string tempo = 1;
    // Its sections' names, in order.
    repeated string sections = 2;
    // Whether it has a metronome block.
    bool metronome = 3;
    // How many pilot hints it has.
    uint32 pilot_hints = 4;
    // The MIDI file it plays. Absent: none.
    optional string midi_file = 5;
    // Its light shows' files.
    repeated string lighting = 6;
    // How many MIDI DMX light shows it has.
    uint32 midi_light_shows = 7;
    // Whether it has notification audio of its own.
    bool notification_audio = 8;
    // Whether it sends a MIDI event when it is selected.
    bool song_select_event = 9;
}

// GetSongResponse is a song's settings, as its file has them.
message GetSongResponse {
    string name = 1;
    // How long the song plays. Absent for a song that failed to load.
    google.protobuf.Duration duration = 2;
    // Why the song failed to load. Absent for a song that loaded.
    optional string failure = 3;
    // Why the song cannot be changed with UpdateSongSettings (it has no
    // config file, or its file does not read). Absent: it can.
    optional string read_only = 4;
    SongLooping looping = 5;
    SongTracks tracks = 6;
    SongSamples samples = 7;
    repeated SongTrigger triggers = 8;
    SongOverview overview = 9;
    // The audio files in the song's directory, sorted: what a track or a
    // sample can be pointed at.
    repeated SongFile files = 10;
    // A fingerprint of the song's file. Sent back as
    // UpdateSongSettingsRequest.expected_revision, it has an update refused
    // when the file changed since it was read.
    string revision = 11;
    // Whether this song is the one playing. An update to it is written at
    // once and takes effect the next time it plays: the playing pass keeps
    // the tracks, loop and samples it started with.
    bool playing = 12;
    // The song's directory relative to the songs directory, as
    // SongListing.base_dir has it.
    optional string base_dir = 13;
}

// UpdateSongSettingsRequest changes some of a song's settings. Each group
// is optional, and a group left out is left alone.
message UpdateSongSettingsRequest {
    string name = 1;
    // The revision GetSong answered. When not empty, an update to a file
    // that has changed since is refused with FAILED_PRECONDITION.
    string expected_revision = 2;
    SongLooping looping = 3;
    SongTracks tracks = 4;
    SongSamples samples = 5;
}

// DeletePlaylistRequest names the playlist to delete.
message DeletePlaylistRequest {
    // The playlist's name. The player's own all_songs is refused.
    string name = 1;
}

// DeletePlaylistResponse is empty: the playlist is gone.
message DeletePlaylistResponse {}

// SetLockRequest locks or unlocks the player.
message SetLockRequest {
    // True to lock the player, false to unlock it.
    bool locked = 1;
}

// SetLockResponse reports the lock as it now stands.
message SetLockResponse {
    // Whether the player is locked.
    bool locked = 1;
}

// WatchStageRequest opens the stage stream.
message WatchStageRequest {
    // The most frames a second the caller wants; 0 is the player's own rate
    // (its sampler's 20 a second). Frames that arrive faster are dropped and
    // the newest one sent.
    uint32 max_rate = 1;
}

// StageUpdate is one message of the stage stream: the layout, or a frame
// read against the layout most recently sent.
message StageUpdate {
    oneof update {
        // What is on the stage. Sent first, and again whenever the venue,
        // the fixtures or their channels change; every frame after it is
        // read against it.
        StageLayout layout = 1;
        // What the stage looks like now.
        StageFrame frame = 2;
    }
}

// RemoteStatus is the player's state as a phone watches it: pushed on the
// Bluetooth status characteristic (and returned by a read of it), and
// streamed by WatchStatus over gRPC. One message for both carriers, with
// the field numbers it has always had on Bluetooth. It is deliberately
// small, to fit a few packets: it carries no beat grid and no sections,
// which a client fetches with the Status method when the song changes.
message RemoteStatus {
    // The name of the current playlist.
    string playlist_name = 1;
    // The name of the song the playlist is on. Empty when it has none.
    string song_name = 2;
    // The length of that song.
    google.protobuf.Duration song_duration = 3;
    // True while a song is playing.
    bool playing = 4;
    // How far into the song the player is, as of this message: on the
    // playback clock while playing, the position kept for the next play while
    // stopped. A client runs its own clock between messages.
    google.protobuf.Duration elapsed = 5;
    // The index of the playlist entry the playlist is on, as
    // GetPlaylistResponse.position gives it. Absent while the song playing is
    // one an edit took off the list.
    optional uint32 position = 6;
    // The song waiting to start by itself, and how long until it does.
    // Absent when none is.
    optional AutoPlayStatus auto_play = 7;
    // The name of the section of the current song that a section loop is set
    // on, as the web UI marks it: from the LoopSection call until the loop
    // is stopped. Absent when no section is looping.
    optional string loop_section = 8;
    // A count the player moves on any change to a track's gain or mute, from
    // any surface: this one, gRPC, OSC or the web UI. A client fetches the
    // gains again when it differs from the last it saw. It wraps, so compare
    // for inequality, not order. Absent only from a player too old to count.
    optional uint32 gains_revision = 9;
    // The ambient light's mode: "auto", "on" or "off", as
    // AmbientStatus.mode gives it. Absent when the player has no
    // DMX engine, or has not read it yet. Read about twice a second.
    optional string ambient_mode = 10;
    // What the ambient light is doing: "playing", "pending", "off" or
    // "unavailable", as AmbientStatus.state gives it. Absent when
    // ambient_mode is.
    optional string ambient_state = 11;
    // Whether the player is locked, as SetLockResponse gives it:
    // while it is, playlist edits are refused. Absent only from a player too
    // old to say.
    optional bool locked = 12;
}

// WatchStatusRequest opens the status stream. It has no fields.
message WatchStatusRequest {}

// GetNetworkInfoRequest asks where the player is on the network. It has no
// fields.
message GetNetworkInfoRequest {}

// GetNetworkInfoResponse is where a phone can reach the player over Wi-Fi.
message GetNetworkInfoResponse {
    // The player's host name, as the system reports it. A phone on a
    // network that resolves names can use it as it is, or with ".local".
    string hostname = 1;
    // The player's addresses on the network, as text: IPv4 and IPv6, with
    // loopback and link-local addresses left out. Empty when it has none.
    repeated string addresses = 2;
    // The port the player's gRPC controller listens on. Absent when the
    // player has no gRPC controller configured.
    optional uint32 grpc_port = 3;
}

// GetLightingAssetRequest asks for one file of the lighting asset store.
message GetLightingAssetRequest {
    // The path under /api/lighting/assets/, as the stage layout and the rig
    // description give it.
    string path = 1;
    // Send the file gzipped. The chunks then join into a gzip stream.
    bool gzip = 2;
}

// AssetChunk is one piece of a lighting asset; the chunks, in order, join
// into the file.
message AssetChunk {
    bytes data = 1;
    // On the first chunk only: how many bytes all the chunks carry together.
    uint64 total_size = 2;
}

// StageVec3 is a point, a direction or three angles, in the stage's axes.
message StageVec3 {
    float x = 1;
    float y = 2;
    float z = 3;
}

// StagePoint is a point on the deck (stage x, y), in meters.
message StagePoint {
    float x = 1;
    float y = 2;
}

// StagePose is where a mover points.
message StagePose {
    // Pan and tilt, in degrees.
    float pan = 1;
    float tilt = 2;
    // The beam direction in stage space, unit length.
    StageVec3 aim = 3;
    // Where the beam meets the deck, when it points down and the venue
    // places the fixture; absent for a beam with no footprint.
    StagePoint floor = 4;
}

// StageCell is a cell of a pixel fixture.
message StageCell {
    string name = 1;
    // The cell's offset in the fixture's frame, in meters.
    StageVec3 offset = 2;
}

// StageFixture is a fixture as the stage views draw it, and the names a
// frame's bytes go by.
message StageFixture {
    string name = 1;
    // The fixture's type. Empty for a fixture the player is driving that the
    // venue does not list: it has channels and no placement.
    string type = 2;
    repeated string tags = 3;
    // Stage position in meters; absent when the venue does not place the
    // fixture.
    StageVec3 position = 4;
    // Mounting rotation in degrees about X, Y, Z; absent when the venue
    // gives none.
    StageVec3 rotation = 5;
    // Degrees the venue says this unit really throws; absent for its type's
    // own. A drawing hint only.
    optional float beam_angle = 6;
    // The rig model's path under the player's /api/lighting/assets/, when
    // the type has one.
    optional string rig = 7;
    // What the fixture can do, as the web API names it: "color", "pan_tilt",
    // "strobe", "cells", "dimmer", "white", "zoom", "focus", "gobo",
    // "color_wheel".
    repeated string capabilities = 8;
    // The cells of a pixel fixture, in the manufacturer's order.
    repeated StageCell cells = 9;
    // The fixture's channel names, sorted. A frame's bytes for this fixture
    // are in this order. Empty for a fixture the player is not driving, which
    // takes no bytes in a frame.
    repeated string channels = 10;
    // Where the fixture pointed when the layout was built; absent when it
    // had no pose. A frame says only the poses that differ from this.
    StagePose pose = 11;
}

// StageVenue is the venue's name, points and scenery.
message StageVenue {
    string name = 1;
    // The venue's focus points, by name, in meters.
    map<string, StageVec3> focus_points = 2;
    // The scenery file under the player's /api/lighting/assets/, when the
    // venue came from an MVR.
    optional string scenery = 3;
    // Why the scenery is missing, when the venue should have had some.
    optional string scenery_error = 4;
}

// StageLayout is everything about the stage that a frame does not repeat.
message StageLayout {
    // Every fixture of the venue and every fixture the player is driving,
    // sorted by name. A frame names a fixture by its index here.
    repeated StageFixture fixtures = 1;
    // The current venue; absent when the player has none.
    StageVenue venue = 2;
    // Which layout of this stream this is: 1 for the first, and one more
    // for each layout sent after it. A frame names the layout it is read
    // against by this.
    uint32 id = 3;
}

// StageStrobe is the rate a strobing fixture flashes at.
message StageStrobe {
    // Index into StageLayout.fixtures.
    uint32 fixture = 1;
    float hertz = 2;
}

// StagePoseChange is a fixture that points somewhere other than the layout
// says.
message StagePoseChange {
    // Index into StageLayout.fixtures.
    uint32 fixture = 1;
    // Where it points now. Absent when the layout gave the fixture a pose
    // and it has none now.
    StagePose pose = 2;
}

// StageCellValues is one cell's bytes.
message StageCellValues {
    // The cell's name, as StageFixture.cells names it.
    string name = 1;
    // One byte for each of StageFixtureCells.channels, in that order.
    bytes values = 2;
}

// StageFixtureCells is the per-cell values of a fixture a per-cell effect
// is driving. It names its own channels, so it is read without the layout's.
message StageFixtureCells {
    // Index into StageLayout.fixtures.
    uint32 fixture = 1;
    // The cells' channel names, sorted.
    repeated string channels = 2;
    // The cells that have exactly those channels, sorted by name. A fixture
    // whose cells do not all have the same channels is listed once for each
    // set of channels.
    repeated StageCellValues cells = 3;
}

// StageFrame is the stage at one instant. It is read against the layout
// most recently sent and nothing else, never against the frame before it,
// so a frame that is lost costs nothing a later one does not say again.
message StageFrame {
    // Every fixture's channel values, end to end: for each of
    // StageLayout.fixtures in order, one byte for each of its
    // StageFixture.channels in order. Its length is the number of channels
    // in the layout; a fixture with no channels takes no bytes.
    bytes channels = 1;
    // The strobing fixtures, by index. A fixture not listed is not strobing.
    repeated StageStrobe strobes = 2;
    // The fixtures whose pose is not the layout's, by index. A fixture not
    // listed points where the layout says, or has no pose there and none
    // now.
    repeated StagePoseChange poses = 3;
    // The fixtures a per-cell effect is driving. A fixture not listed shows
    // its own channels on every cell.
    repeated StageFixtureCells cells = 4;
    // The names of the effects running.
    repeated string active_effects = 5;
    // The fixtures a fixture test's output covers, as indexes into
    // StageLayout.fixtures, ascending: their bytes, cells and poses are the
    // test's.
    repeated uint32 under_test = 6;
    // The StageLayout.id of the layout this frame is read against. A client
    // drops a frame whose layout is not the id of the layout it holds: its
    // bytes and indexes are in another layout's order.
    uint32 layout = 7;
}

// PlayerService is a service for controlling the mtrack player.
service PlayerService {
    // Play will play the current song in the playlist if no other songs
    // are playing.
    rpc Play(PlayRequest) returns (PlayResponse);

    // PlayFrom will play the current song starting from a specific time.
    rpc PlayFrom(PlayFromRequest) returns (PlayResponse);

    // PlaySongFrom will play a specific song starting from a specific time.
    rpc PlaySongFrom(PlaySongFromRequest) returns (PlayResponse);

    // Seek jumps to a position within the current song. While playing,
    // playback restarts at the position with all subsystems re-synchronized;
    // while stopped, the position is stored and used by the next Play.
    rpc Seek(SeekRequest) returns (SeekResponse);

    // SeekToSection jumps to the start of the named section of the current song.
    rpc SeekToSection(SeekToSectionRequest) returns (SeekResponse);

    // Previous will move the playlist to the previous song.
    rpc Previous(PreviousRequest) returns (PreviousResponse);

    // Next will move the playlist to the next song.
    rpc Next(NextRequest) returns (NextResponse);

    // NavigateToSong makes an entry of the active playlist the current one
    // without playing it. Like Next, it does not move the playlist while a
    // song plays (unlike Next it does not break a section loop). A position
    // past the end is OUT_OF_RANGE; a song_name that is not the entry's, or an
    // entry whose song did not load, is FAILED_PRECONDITION.
    rpc NavigateToSong(NavigateToSongRequest) returns (NavigateToSongResponse);

    // Stop will stop the currently playing song.
    rpc Stop(StopRequest) returns (StopResponse);

    // SwitchToPlaylist will switch the player to a different playlist.
    rpc SwitchToPlaylist(SwitchToPlaylistRequest) returns (SwitchToPlaylistResponse);

    // Status will return the current status of the player.
    rpc Status(StatusRequest) returns (StatusResponse);


    // GetCues returns the list of cues in the current song's lighting timeline.
    rpc GetCues(GetCuesRequest) returns (GetCuesResponse);

    // GetActiveEffects returns a formatted string listing all active lighting effects.
    rpc GetActiveEffects(GetActiveEffectsRequest) returns (GetActiveEffectsResponse);

    // StopSamples will stop all triggered samples that are currently playing.
    rpc StopSamples(StopSamplesRequest) returns (StopSamplesResponse);

    // GetConfig returns the current configuration as YAML with a checksum.
    rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);

    // UpdateAudio updates the audio configuration section.
    rpc UpdateAudio(UpdateAudioRequest) returns (UpdateConfigResponse);

    // UpdateMidi updates the MIDI configuration section.
    rpc UpdateMidi(UpdateMidiRequest) returns (UpdateConfigResponse);

    // UpdateDmx updates the DMX configuration section.
    rpc UpdateDmx(UpdateDmxRequest) returns (UpdateConfigResponse);

    // UpdateControllers updates the controllers configuration.
    rpc UpdateControllers(UpdateControllersRequest) returns (UpdateConfigResponse);

    // AddProfile adds a new hardware profile.
    rpc AddProfile(AddProfileRequest) returns (UpdateConfigResponse);

    // UpdateProfile updates a profile at a specific index.
    rpc UpdateProfile(UpdateProfileRequest) returns (UpdateConfigResponse);

    // RemoveProfile removes a profile at a specific index.
    rpc RemoveProfile(RemoveProfileRequest) returns (UpdateConfigResponse);

    // LoopSection activates section looping for the named section.
    rpc LoopSection(LoopSectionRequest) returns (LoopSectionResponse);

    // StopSectionLoop deactivates section looping. The current iteration
    // finishes and the song continues from the section end.
    rpc StopSectionLoop(StopSectionLoopRequest) returns (StopSectionLoopResponse);

    // SectionAck acknowledges the current section in reactive looping mode,
    // arming the loop so it engages at the section end.
    rpc SectionAck(SectionAckRequest) returns (SectionAckResponse);

    // SetTrackGain sets the gain of a single output track in dB.
    rpc SetTrackGain(SetTrackGainRequest) returns (SetTrackGainResponse);

    // SetTrackMute mutes or unmutes an output track without changing its
    // gain. Mute state is runtime-only and never persisted.
    rpc SetTrackMute(SetTrackMuteRequest) returns (SetTrackMuteResponse);

    // GetTrackGains returns the gains of all output tracks in dB.
    rpc GetTrackGains(GetTrackGainsRequest) returns (GetTrackGainsResponse);

    // SetAmbientMode sets ambient light's mode: auto, on or off.
    rpc SetAmbientMode(SetAmbientModeRequest) returns (SetAmbientModeResponse);

    // CancelAutoPlay calls off an auto play waiting to start, leaving the
    // player stopped on its song with ambient light up, as after a stop.
    rpc CancelAutoPlay(CancelAutoPlayRequest) returns (CancelAutoPlayResponse);

    // ListPlaylists names the player's playlists and the active one.
    rpc ListPlaylists(ListPlaylistsRequest) returns (ListPlaylistsResponse);

    // GetPlaylist returns a playlist's entries and the one it is on. An
    // unknown name is NOT_FOUND.
    rpc GetPlaylist(GetPlaylistRequest) returns (GetPlaylistResponse);

    // SavePlaylist sets a playlist's songs and their order, and with
    // set_settings and set_ambient its settings, making the playlist when
    // create is set, and answers with it as GetPlaylist would. Refused
    // while the player is locked. A name the player refuses, a song it does
    // not have, or a setting it would not load is INVALID_ARGUMENT, saying
    // what is wrong; a playlist that exists under create is ALREADY_EXISTS,
    // and one that does not, without it, is NOT_FOUND.
    rpc SavePlaylist(SavePlaylistRequest) returns (GetPlaylistResponse);

    // ListLightShows names the .light files an ambient light can play, as
    // the web UI's lighting list finds them. Open while locked.
    rpc ListLightShows(ListLightShowsRequest) returns (ListLightShowsResponse);

    // ListSongs pages through the song library, loaded songs and failed
    // ones, sorted by name. Open while locked.
    rpc ListSongs(ListSongsRequest) returns (ListSongsResponse);

    // GetSong reads a song's settings: its looping, tracks and samples as
    // its file has them, what else it has, and the audio files beside it.
    // An unknown name is NOT_FOUND. Open while locked.
    rpc GetSong(GetSongRequest) returns (GetSongResponse);

    // UpdateSongSettings changes a song's looping, tracks or samples in its
    // file, keeping everything else in it, as the web UI's song save writes
    // it, and answers with the song as GetSong now reports it. Refused while
    // the player is locked. A setting the player would not load, or a file
    // that is not the song's, is INVALID_ARGUMENT, saying why; a file
    // changed since expected_revision is FAILED_PRECONDITION.
    rpc UpdateSongSettings(UpdateSongSettingsRequest) returns (GetSongResponse);

    // DeletePlaylist deletes a playlist's file. Refused while the player
    // is locked. An unknown name is NOT_FOUND. The active playlist falls
    // back to all_songs.
    rpc DeletePlaylist(DeletePlaylistRequest) returns (DeletePlaylistResponse);

    // SetLock locks or unlocks the player, as the web UI's lock does. Open
    // while locked, or nothing could unlock it.
    rpc SetLock(SetLockRequest) returns (SetLockResponse);

    // WatchStage is a stream of what the stage looks like: the layout first,
    // then a frame whenever something changes, and the layout again if the
    // venue does. Open while locked. A player with no lighting sends an
    // empty layout and an empty frame, and the stream stays open.
    rpc WatchStage(WatchStageRequest) returns (stream StageUpdate);

    // GetLightingAsset streams a file of the lighting asset store (the rig
    // description, models and scenery the stage layout names), as the web
    // UI's /api/lighting/assets/ serves it, in chunks. NOT_FOUND for a path
    // that is not in the store or not a type it serves. Open while locked.
    rpc GetLightingAsset(GetLightingAssetRequest) returns (stream AssetChunk);

    // WatchStatus is a stream of the player's status as a phone watches it:
    // the current status at once, then again whenever it changes, and at
    // least once a second while a song is playing, for the clock. A slow
    // client is sent the latest status and skips those between. Open while
    // locked.
    rpc WatchStatus(WatchStatusRequest) returns (stream RemoteStatus);

    // GetNetworkInfo tells where the player is on the network: its host
    // name, its addresses and the port of its gRPC controller. A phone
    // connected over Bluetooth asks it to learn where to find the player
    // over Wi-Fi. Open while locked.
    rpc GetNetworkInfo(GetNetworkInfoRequest) returns (GetNetworkInfoResponse);
}
