syntax = "proto3";

package ble.v1;

import "google/protobuf/duration.proto";
import "player/v1/player.proto";

// Every response notification reaches every phone subscribed to the response
// characteristic: the radio stack notifies a characteristic's subscribers
// together, so one phone sees the answers to another's calls. A client
// therefore starts its call ids at a random value and ignores a Response whose
// id it did not send.

// Request is one call from a phone: a PlayerService method and its request
// message.
message Request {
    // The call's id. The response carries it back, so a client matches
    // responses to its calls.
    uint32 id = 1;
    // The bare name of a PlayerService method, such as Play.
    string method = 2;
    // The method's request message, serialized.
    bytes payload = 3;
}

// Response answers one Request.
message Response {
    // The id of the Request this answers.
    uint32 id = 1;
    // The gRPC status code of the call; 0 is OK.
    uint32 code = 2;
    // The status message, when code is not 0.
    string message = 3;
    // The method's response message, serialized. Empty when code is not 0.
    bytes payload = 4;
}

// Status is the player's state, pushed on the status characteristic and
// returned by a read of it. It is deliberately small, to fit a few packets:
// it carries no beat grid and no sections, which a client fetches with the
// Status method when the song changes.
message Status {
    // The name of the current playlist.
    string playlist_name = 1;
    // The name of the song the playlist is on. Empty when it has none.
    string song_name = 2;
    // The length of that song.
    google.protobuf.Duration song_duration = 3;
    // True while a song is playing.
    bool playing = 4;
    // How far into the song the player is, as of this message: on the
    // playback clock while playing, the position kept for the next play while
    // stopped. A client runs its own clock between messages.
    google.protobuf.Duration elapsed = 5;
    // The index of the playlist entry the playlist is on, as
    // GetPlaylistResponse.position gives it. Absent while the song playing is
    // one an edit took off the list.
    optional uint32 position = 6;
    // The song waiting to start by itself, and how long until it does.
    // Absent when none is.
    optional player.v1.AutoPlayStatus auto_play = 7;
    // The name of the section of the current song that a section loop is set
    // on, as the web UI marks it: from the LoopSection call until the loop
    // is stopped. Absent when no section is looping.
    optional string loop_section = 8;
    // A count the player moves on any change to a track's gain or mute, from
    // any surface: this one, gRPC, OSC or the web UI. A client fetches the
    // gains again when it differs from the last it saw. It wraps, so compare
    // for inequality, not order. Absent only from a player too old to count.
    optional uint32 gains_revision = 9;
    // The ambient light's mode: "auto", "on" or "off", as
    // player.v1.AmbientStatus.mode gives it. Absent when the player does not
    // report it, which today is always: the Status method carries it.
    optional string ambient_mode = 10;
    // What the ambient light is doing: "playing", "pending", "off" or
    // "unavailable", as player.v1.AmbientStatus.state gives it. Absent when
    // ambient_mode is.
    optional string ambient_state = 11;
}
