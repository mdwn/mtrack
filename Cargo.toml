[workspace]
members = ["harness"]
exclude = ["fuzz"]

[package]
name = "mtrack"
description = "A multitrack audio and MIDI player for live performances."
license = "GPL-3.0"
version = "0.16.0"
authors = ["Michael Wilson <mike@mdwn.dev>"]
edition = "2021"
repository = "https://github.com/mdwn/mtrack"
readme = "README.md"
keywords = ["audio"]
categories = ["multimedia", "multimedia::audio"]
# NOTE: include globs match the FILESYSTEM, not git — untracked and even
# gitignored files are packaged if they match. Keep dev-only trees under
# src/webui/svelte explicitly excluded so a `cargo publish` from a working
# machine can't sweep in local state (e.g. .claude/, Playwright output).
include = [
    "build.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "src/**/*",
    "!src/webui/svelte/node_modules/**",
    "!src/webui/svelte/src/**",
    "!src/webui/svelte/.svelte-kit/**",
    "!src/webui/svelte/.claude/**",
    "!src/webui/svelte/e2e/**",
    "!src/webui/svelte/test-results/**",
    "!src/webui/svelte/playwright-report/**",
    "!src/webui/svelte/.playwright-mcp/**",
]

[package.metadata.deb]
# Depends are hand-written, NOT `$auto`. dpkg-shlibdeps emits *versioned*
# dependencies (e.g. `libasound2 (>= 1.0.16)`), and libasound2t64 -- the
# time_t rename shipped from Debian trixie and Ubuntu noble onward -- only
# carries `Provides: libasound2 (= <version>)`. A versioned Provides satisfies
# an unversioned Depends but not a versioned one, so an auto-generated deb
# builds cleanly on bookworm and then refuses to install on trixie. The
# alternation below resolves to whichever name the target release actually
# ships, on both sides of the rename.
depends = "libasound2t64 | libasound2, libudev1"
# olad is a separate daemon; mtrack speaks to it over TCP and only for DMX
# output, so lighting users need it and everyone else does not.
recommends = "ola"
# Headless discovery (mtrack.local) for a machine with no monitor. Suggested
# rather than recommended so a desktop install does not pull in mDNS uninvited.
suggests = "avahi-daemon"
section = "sound"
priority = "optional"
maintainer = "Michael Wilson <mike@mdwn.dev>"
license-file = ["LICENSE", "0"]
extended-description = """\
mtrack is a multitrack audio, MIDI, and lighting player for live performances. \
It runs on small devices like the Raspberry Pi and is designed to be controlled \
remotely -- from your feet, a phone, or any device with a browser -- so you never \
have to babysit a computer on stage."""
maintainer-scripts = "packaging/debian"
conf-files = ["/etc/default/mtrack"]
assets = [
    ["target/release/mtrack", "usr/bin/", "755"],
    ["packaging/debian/default", "etc/default/mtrack", "644"],
    ["README.md", "usr/share/doc/mtrack/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/mtrack/CHANGELOG.md", "644"],
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"

[dependencies]
clap = { version = "4.5.60", features = ["cargo", "derive"] }
config = "0.15.19"
cpal = "0.18.1"
rayon = "1.11.0"
num_cpus = "1.17.0"
duration-string = "0.5.3"
symphonia = { version = "0.6", features = ["all"] }
midir = "0.11.0"
midly = "0.5.3"
ola = "0.1.0"
prost = "0.14"
prost-types = "0.14"
rosc = "0.11.4"
rtrb = "0.3"
rubato = "3"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
yaml-rust2 = "0.11"
shh = "1.0.1"
spin_sleep = "1.3.3"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = [
    "fs",
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
tonic-web = "0.14"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
crossbeam-channel = "0.5.15"
thread-priority = "3.0"
parking_lot = "0.12"
tokio-util = "0.7"
hostname = "0.4"
pest = "2.8"
pest_derive = "2.8"
indexmap = { version = "2", features = ["serde"] }
serde_json = "1.0"
sha2 = "0.10"
ratatui = "0.30"
crossterm = "0.29"

rmcp = { version = "3.4", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
] }
schemars = "1"
axum = { version = "0.8", features = ["ws", "multipart"] }
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
rust-embed = "8"
notify = "8"
notify-debouncer-mini = "0.7"
futures-util = "0.3"
tempfile = "3.26.0"
quick-xml = "0.41.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
criterion = "0.7"
hound = "3.5.1"
reqwest = { version = "0.13", features = ["json", "stream"] }
serial_test = "3.4.0"
tokio-tungstenite = "0.28"

[build-dependencies]
jiff = "0.2"
tonic-build = "0.14"
tonic-prost-build = "0.14"

[lib]
name = "mtrack"
path = "src/lib.rs"

[[bench]]
name = "mixer"
harness = false

[package.metadata.cargo-shear]
ignored = ["prost"]
