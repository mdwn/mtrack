# The directory where all of your songs are located, frequently referred to as the song repository.
# If the path is not absolute, it will be relative to the location of this file.
songs: songs

# The path to the playlist file.
playlist: playlist.yaml

# --- Hardware Profiles ---
#
# Hardware profiles define complete host configurations for audio, MIDI, DMX,
# triggers, and controllers. Each profile file lives in the profiles directory
# and includes `kind: hardware_profile` to identify itself.
#
# Profiles are filtered by hostname. The first match is used.
# Set the MTRACK_HOSTNAME environment variable to override the system hostname.
#
# Subsystem semantics:
#   - All subsystems (audio, MIDI, DMX) are optional
#   - Presence in a profile = required for that host (player waits/retries)
#   - Absence from a profile = skipped for that host (player proceeds without it)
#
# Files are sorted by filename. Use numeric prefixes to control priority:
#   profiles/01-pi-a.yaml, profiles/02-pi-b.yaml, profiles/99-fallback.yaml
#
# See the profiles/ directory for examples.
profiles_dir: profiles/

# MIDI-triggered sample configuration.
# Samples defined here are available globally and can be triggered via MIDI events.
# Per-song sample overrides can be defined in individual song configuration files.
samples:
  # Sample definitions by name. These can be referenced by triggers below.
  kick:
    # The audio file to play. Path is relative to this config file.
    file: songs/a-really-cool-song/click.wav
    # Output channels to route this sample to (1-indexed).
    # Use output_channels for fixed channel numbers:
    output_channels: [3, 4]
    # Or use output_track to reference a track mapping name from the active profile's
    # track_mappings. This allows the same sample definition to work across different
    # hardware profiles with different channel assignments:
    # output_track: "kick-out"
    # If both are set, output_track takes precedence.
    # Velocity handling mode: ignore, scale, or layers.
    velocity:
      mode: scale
    # Behavior on Note Off: play_to_completion, stop, or fade.
    release_behavior: play_to_completion
    # Behavior when retriggered while playing: cut or polyphonic.
    retrigger: cut
    # Maximum concurrent voices for this sample (optional).
    max_voices: 4

  snare:
    file: songs/another-cool-song/click.wav
    output_channels: [3, 4]
    velocity:
      mode: ignore
      # Default velocity when mode is ignore (0-127).
      default: 100
    release_behavior: play_to_completion
    retrigger: polyphonic
    max_voices: 8

  # Example of velocity layers - different samples for different velocity ranges.
  hihat:
    output_channels: [3, 4]
    velocity:
      mode: layers
      # Whether to also scale volume by velocity within each layer.
      scale: true
      layers:
      - range: [1, 60]
        file: songs/the-slow-one/click.wav
      - range: [61, 100]
        file: songs/sound-check/click.wav
      - range: [101, 127]
        file: songs/a-really-fast-one/click.wav
    release_behavior: play_to_completion
    retrigger: polyphonic

# Triggers that play these samples (MIDI events or audio inputs) are configured per host in
# the `trigger:` block of a hardware profile; see profiles/04-drum-trigger.yaml. A top-level
# `sample_triggers:` list is the legacy form and is ignored when profiles are in use.

# Maximum number of concurrent sample voices globally. Defaults to 32.
max_sample_voices: 32
