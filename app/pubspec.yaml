name: mtrack_remote
description: "Bluetooth remote for the mtrack player"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  universal_ble: ^3.2.0
  fixnum: ^1.1.1
  protobuf: ^6.1.0
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  protoc_plugin: ^25.1.0
  fake_async: ^1.3.3
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  # The fonts are bundled so the app needs no network. Each is a variable font
  # (the weight is an axis) under the SIL Open Font License, whose text sits
  # beside the font and is registered with the licence page in
  # lib/src/ui/licences.dart.
  assets:
    - assets/fonts/nunito/OFL.txt
    - assets/fonts/inter/OFL.txt
    - assets/fonts/jetbrains_mono/OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono.ttf
