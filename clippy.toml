disallowed-methods = [
    # Counts from the start of the input on every call, so one per effect line
    # made a long show's parse quadratic (#788: 5 s for a Pi's library). Use
    # `Pair::line_col`, which reads the parse's line index.
    { path = "pest::position::Position::line_col", reason = "walks the whole input on each call; use Pair::line_col" },
]

# `ConfigError` is 128 bytes with its tag and its largest variant is under
# that. Clippy measures an enum of the crate it is checking by its largest
# variant and one from another crate by its whole size, so the player's
# functions that return it began to trip `result_large_err` when the type
# moved to mtrack-core, with nothing about it changed. Its size is held where
# it is defined instead (crates/mtrack-core/src/config/error.rs).
large-error-ignored = ["mtrack_core::config::ConfigError"]
