[package]
name = "mtrack-core"
description = "What mtrack reads and checks without any hardware: its configuration, tempo maps and light shows."
license = "GPL-3.0"
version = "0.18.1"
authors = ["Michael Wilson <mike@mdwn.dev>"]
edition = "2021"
repository = "https://github.com/mdwn/mtrack"
# Not on crates.io yet. The player depends on it, and crates.io takes no
# crate whose dependency it does not have: this has to be published before
# the player's next release tag (.github/workflows/publish.yaml).
publish = false

[features]
# Derives the TypeScript types of the structs the web UI's rules module
# shares (see crates/mtrack-rules-wasm).
tsify = ["dep:tsify-next", "dep:wasm-bindgen"]
# What the player's own tests reach for in this crate's modules.
test-util = []

[dependencies]
config = "0.15.19"
hostname = "0.4"
indexmap = { version = "2", features = ["serde"] }
midly = "0.5.3"
parking_lot = "0.12"
pest = "2.8"
pest_derive = "2.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0.18"
# The blocking pool, for the file writes a server makes from async code.
tokio = { version = "1.50.0", features = ["rt"] }
tracing = "0.1.44"
yaml-rust2 = "0.11"
# Only with the `tsify` feature (see [features]).
tsify-next = { version = "0.5", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
serial_test = "3.4.0"
tempfile = "3.26.0"
