[package]
name = "mtrack-harness"
description = "Hardware verification harness for mtrack. Runs the real player against real hardware and reports what it could and could not verify."
license = "GPL-3.0"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "mtrack-harness"
path = "src/main.rs"

[dependencies]
mtrack = { path = ".." }

# Hardware access. These mirror mtrack's own versions so the harness talks to
# the same driver stack the player does.
cpal = "0.17.1"
midir = "0.10.1"
shh = "1.0.1"
hound = "3.5.1"
midly = "0.5.3"

# Talking to a running player.
reqwest = { version = "0.13", features = ["json"] }
tonic = "0.14"
prost-types = "0.14"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "time"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
tempfile = "3.26.0"
futures-util = "0.3"
