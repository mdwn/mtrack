name: Raspberry Pi image

# Kept out of publish.yaml on purpose. An image build is tens of minutes and
# tens of gigabytes, and a failure here should not sit in the middle of the
# chain that publishes the crate, the release and the binaries.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build an image for (e.g. v0.16.0)'
        required: true
        type: string
      pi_gen_ref:
        description: 'pi-gen ref to build with (must be an arm64 branch)'
        required: false
        default: 'arm64'
        type: string
  # The image is only as correct as the package it installs and the unit that
  # package renders, so a change to either has to be able to prove it still
  # produces a bootable image. packaging/debian is in here rather than just
  # packaging/pi-gen because the stage leans on postinst behaviour -- it enables
  # the service precisely because postinst declines to in a chroot -- and
  # src/cli.rs is in here because it holds the unit template, which has broken
  # `systemctl enable` before.
  pull_request:
    paths:
      - 'packaging/**'
      - 'src/cli.rs'
      - '.github/workflows/pi-image.yaml'

permissions:
  contents: write

jobs:
  build-image:
    name: Build the Raspberry Pi image
    # Native arm64. pi-gen runs the target's own binaries in a chroot, and on an
    # x86 runner that means qemu-user-static and binfmt registration; here it
    # means nothing at all.
    runs-on: ubuntu-22.04-arm
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      # pi-gen's master branch sets `export ARCH=armhf` unconditionally, *after*
      # sourcing config, so a 64-bit image cannot be asked for -- it is selected
      # by branch. The arm64 branch is the same tree with ARCH=arm64 and the
      # same trixie default.
      PI_GEN_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.pi_gen_ref || 'arm64' }}
      IS_PR: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout mtrack
        uses: actions/checkout@v6
        with:
          path: mtrack

      - name: Free up disk space
        # A Lite build plus its per-stage rootfs copies needs more room than a
        # hosted runner has spare. The toolchains removed here are of no use to
        # a debootstrap.
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm || true
          sudo apt-get clean
          df -h /

      # ---- Where the package comes from -----------------------------------
      # A pull request has no release to draw from, and drawing from the last
      # one would test the previous version's package rather than this change's.
      # So a PR builds the package it is about to install, and only a PR does:
      # an image that gets published must carry the binary the release
      # published, not one built here.

      - name: Install build dependencies (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libssl-dev

      - name: Install protoc (pull requests only)
        # Deliberately not apt's protobuf-compiler, exactly as in publish.yaml:
        # ubuntu-22.04 ships protoc 3.12, which refuses the proto3 optional
        # fields our protos use ("--experimental_allow_proto3_optional was not
        # set"). That is the failure that broke the v0.16.0 Linux binaries, and
        # it broke this job's first run too. The runner is 22.04 on purpose --
        # it matches the glibc floor the released binaries are built against --
        # so protoc has to come from somewhere newer than its archive.
        if: github.event_name == 'pull_request'
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'pull_request'
      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'pull_request'
        with:
          workspaces: mtrack
          shared-key: "pi-image"
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: '22'
      - name: Cache node modules
        if: github.event_name == 'pull_request'
        uses: actions/cache@v5
        with:
          path: mtrack/src/webui/svelte/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mtrack/**/package-lock.json') }}
          restore-keys: node-modules-${{ runner.os }}-${{ runner.arch }}-
      - uses: taiki-e/install-action@v2
        if: github.event_name == 'pull_request'
        with:
          tool: cargo-deb
      - name: Package it
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cd mtrack
          # A release build rather than a debug one. Nothing in the image build
          # runs mtrack beyond asking it to print its own unit, so optimisation
          # is irrelevant -- but a debug binary is an order of magnitude larger,
          # and disk is the scarcest thing on this runner.
          make build-ui
          cargo build --release --locked --bin mtrack
          cargo deb --no-build --no-strip --output "$GITHUB_WORKSPACE/deb/"
          echo "MTRACK_DEB=$(ls "$GITHUB_WORKSPACE"/deb/mtrack_*_arm64.deb)" >> "$GITHUB_ENV"
          echo "DEB_PROVENANCE=built-from-source" >> "$GITHUB_ENV"
          # The package is extracted; the build tree that produced it is several
          # gigabytes of no further use, and pi-gen is about to want all of it.
          # This does cost the compilation cache -- rust-cache saves in a
          # post-job step, so a target directory deleted here is never stored,
          # and every run compiles cold. Running out of disk fails the job
          # outright, while a cold build only makes it slower, so the disk wins.
          # The registry cache still restores, which saves the downloads.
          rm -rf target
          df -h /

      - name: Fetch the released package
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "mtrack_*_arm64.deb" --dir "$GITHUB_WORKSPACE/deb"
          ls -l "$GITHUB_WORKSPACE/deb"
          echo "MTRACK_DEB=$(ls "$GITHUB_WORKSPACE"/deb/mtrack_*_arm64.deb)" >> "$GITHUB_ENV"
          echo "DEB_PROVENANCE=from-release" >> "$GITHUB_ENV"

      - name: Refuse to publish a source-built image
        # The two steps above are mutually exclusive by their conditions, so
        # this should be unreachable. It is here so that stays true: an edit
        # that lets a source build leak into a published image fails here rather
        # than shipping a card with a binary nobody can trace to a release.
        run: |
          set -euo pipefail
          echo "package provenance: ${DEB_PROVENANCE:-unset}"
          if [ "${IS_PR}" != "true" ] && [ "${DEB_PROVENANCE}" != "from-release" ]; then
            echo "This run publishes to a release but the package was not taken" >&2
            echo "from one (provenance: ${DEB_PROVENANCE:-unset})." >&2
            exit 1
          fi

      # ---- The image -------------------------------------------------------

      - name: Checkout pi-gen
        uses: actions/checkout@v6
        with:
          repository: RPi-Distro/pi-gen
          ref: ${{ env.PI_GEN_REF }}
          path: pi-gen

      - name: Install pi-gen's dependencies
        # From pi-gen's README. Its build.sh checks these up front and stops
        # before doing any work if one is missing, so this is not optional.
        # qemu is in the list because pi-gen's `depends` asks for it
        # unconditionally; a native build never invokes it.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            coreutils quilt parted qemu-user-binfmt debootstrap zerofree zip \
            dosfstools e2fsprogs libarchive-tools libcap2-bin grep rsync \
            xz-utils file git curl bc gpg pigz xxd arch-test bmap-tools kmod

      - name: Configure the build
        run: |
          set -euo pipefail
          cd pi-gen
          cp "$GITHUB_WORKSPACE/mtrack/packaging/pi-gen/config" ./config
          # Lite only: no desktop stages, and no image from stage2 -- the only
          # image we want is the one our stage exports.
          touch ./stage3/SKIP ./stage4/SKIP ./stage5/SKIP
          touch ./stage2/SKIP_IMAGES ./stage4/SKIP_IMAGES ./stage5/SKIP_IMAGES
          echo "MTRACK_STAGE_DIR=$GITHUB_WORKSPACE/mtrack/packaging/pi-gen/stage-mtrack" >> "$GITHUB_ENV"

      - name: Build the image
        run: |
          set -euo pipefail
          cd pi-gen
          sudo --preserve-env=MTRACK_DEB,MTRACK_STAGE_DIR ./build.sh

      - name: Name the artifact
        id: artifact
        run: |
          set -euo pipefail
          if [ "${IS_PR}" = "true" ]; then
            VERSION="pr${{ github.event.pull_request.number }}"
          else
            VERSION="${RELEASE_TAG#v}"
          fi
          # build.sh runs under sudo, so deploy/ and everything in it belongs to
          # root and this step does not: moving the image out of that directory
          # needs write permission on the directory itself. Take ownership once
          # here rather than sudo-ing each of the steps that follow, which also
          # lets upload-artifact read it.
          sudo chown -R "$(id -u):$(id -g)" pi-gen/deploy
          built="$(ls pi-gen/deploy/*.img.xz | head -1)"
          out="mtrack-${VERSION}-raspberrypi-arm64.img.xz"
          mv "$built" "$out"
          sha256sum "$out" > "$out.sha256"
          ls -lh "$out"
          echo "image=$out" >> "$GITHUB_OUTPUT"

      - name: Upload the image for inspection (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: raspberrypi-image
          path: |
            ${{ steps.artifact.outputs.image }}
            ${{ steps.artifact.outputs.image }}.sha256
          retention-days: 7

      - name: Upload to the release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            "${{ steps.artifact.outputs.image }}" \
            "${{ steps.artifact.outputs.image }}.sha256" --clobber
