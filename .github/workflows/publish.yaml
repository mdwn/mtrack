name: publish
on:
  push:
    tags:
    - 'v*.*.*'
  # Rebuild and upload binaries for an existing release without re-tagging —
  # for when a binary job fails after the crates.io publish and GitHub
  # release have already succeeded.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build binaries for (e.g. v0.16.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Publishes mtrack to crates.io.
  publish:
    name: Publish to crates.io
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # A tag whose version was never bumped in Cargo.toml used to fail only at
    # `cargo publish` ("version already uploaded") — after the GitHub release
    # already existed. Fail the whole pipeline up front instead.
    - name: Verify tag matches crate version
      run: |
        CRATE_VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
        if [ "v${CRATE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
          echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CRATE_VERSION}." >&2
          echo "Bump the version (and Cargo.lock) before tagging." >&2
          exit 1
        fi
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config libssl-dev protobuf-compiler
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Cache node modules
      uses: actions/cache@v6
      with:
        path: src/webui/svelte/node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: node-modules-${{ runner.os }}-
    - name: Build frontend
      run: make build-ui
    - name: Run publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: cargo publish --locked --allow-dirty

  # Creates a release on Github. Gated on the crates.io publish so a bad tag
  # (wrong version, packaging failure) doesn't leave a half-made release to
  # clean up.
  release:
    name: Create a GitHub release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Extract release notes
        id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.extract-release-notes.outputs.release_notes }}
        run: gh release create --notes "$RELEASE_NOTES" --title "${{ github.ref_name }}" "${{ github.ref_name }}"

  # Builds release binaries for each supported platform and uploads them to the
  # GitHub release. Linux binaries are built on the oldest supported Ubuntu LTS
  # so the resulting glibc-linked binary runs on newer distros as well.
  build-binaries:
    name: Build binary (${{ matrix.target }})
    needs: release
    # On a tag push this still requires the release to exist; on a manual
    # dispatch the release already exists and the skipped needs is fine.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            platform: linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            platform: linux
          - target: x86_64-apple-darwin
            os: macos-14
            platform: macos
          - target: aarch64-apple-darwin
            os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Linux system dependencies
        # protoc comes from the script below, not apt: ubuntu-22.04 ships
        # protoc 3.12, which rejects the proto3 optional fields our protos
        # use ("--experimental_allow_proto3_optional was not set") — the
        # failure that broke the v0.16.0 Linux binaries.
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config libssl-dev
      - name: Install protoc
        if: matrix.platform == 'linux'
        run: ./scripts/install-protoc.sh
      - name: Install macOS system dependencies
        if: matrix.platform == 'macos'
        run: brew install pkg-config protobuf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/cache@v6
        with:
          path: src/webui/svelte/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: node-modules-${{ runner.os }}-
      - name: Build frontend
        run: make build-ui
      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          STAGE="mtrack-${VERSION}-${{ matrix.target }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/mtrack" "$STAGE/"
          cp README.md LICENSE CHANGELOG.md "$STAGE/"
          tar czf "${STAGE}.tar.gz" "$STAGE"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          else
            shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          fi
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG}" mtrack-*.tar.gz mtrack-*.tar.gz.sha256 --clobber

  # Builds Debian packages and attaches them to the release. The .deb is what
  # the Raspberry Pi image installs and what `apt upgrade` later replaces, so it
  # carries the service account, the /etc/default/mtrack defaults and the
  # systemd unit that `mtrack systemd` renders on the target.
  #
  # It repackages the binaries the previous job already published rather than
  # rebuilding them, so a tarball and a .deb of the same version contain byte
  # identical binaries -- there is no "which build is this" question to answer
  # when someone reports a bug. That also means one cheap amd64 runner can emit
  # both architectures: nothing here executes the packaged binary.
  build-debs:
    name: Build Debian packages
    needs: build-binaries
    if: ${{ !cancelled() && needs.build-binaries.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cargo-deb"
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Stage the published binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            asset="mtrack-${VERSION}-${target}.tar.gz"
            gh release download "$RELEASE_TAG" --pattern "$asset" --dir dl
            tar xzf "dl/${asset}" -C dl
            mkdir -p "target/${target}/release"
            install -m 755 "dl/mtrack-${VERSION}-${target}/mtrack" \
                           "target/${target}/release/mtrack"
          done
      - name: Build packages
        run: |
          set -euo pipefail
          mkdir -p debs
          # --no-strip is load bearing twice over: the host strip cannot touch an
          # aarch64 binary, and stripping at all would make the packaged binary
          # differ from the one in the published tarball.
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            cargo deb --no-build --no-strip --target "$target" --output debs/
          done
          ls -l debs/
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG}" debs/*.deb --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: debs
          path: debs/*.deb
          retention-days: 1

  # Regenerates the apt archive and syncs it to R2.
  #
  # Skipped entirely until the repository variable APT_R2_BUCKET is set, so the
  # .deb above is useful on its own -- installable straight from the release
  # page -- without anyone having to own a signing key first.
  #
  # Required to enable:
  #   vars.APT_R2_BUCKET       R2 bucket name
  #   vars.APT_R2_ENDPOINT     https://<account-id>.r2.cloudflarestorage.com
  #   secrets.APT_R2_ACCESS_KEY_ID / APT_R2_SECRET_ACCESS_KEY
  #   secrets.APT_GPG_PRIVATE_KEY   ASCII-armoured signing key
  #   secrets.APT_GPG_KEY_ID        fingerprint of that key
  publish-apt:
    name: Publish apt repository
    needs: build-debs
    if: ${{ !cancelled() && needs.build-debs.result == 'success' && vars.APT_R2_BUCKET != '' }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.APT_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.APT_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: ${{ vars.APT_R2_ENDPOINT }}
      # R2 does not implement the CRC32 integrity headers that aws-cli started
      # sending by default, and rejects them with "Header
      # 'x-amz-checksum-algorithm' with value 'CRC32' not implemented".
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      BUCKET: ${{ vars.APT_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: debs
          path: debs
      - name: Install archive tooling
        run: sudo apt-get update && sudo apt-get install -y apt-utils
      - name: Import the signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Fetch the existing pool
        # The pool is cumulative: without this, regenerating the indices would
        # drop every previously published version and take `apt install
        # mtrack=<older>` -- the rollback path -- with it.
        run: |
          set -euo pipefail
          mkdir -p repo/pool
          aws s3 sync "s3://${BUCKET}/pool" repo/pool
      - name: Build the archive
        run: |
          set -euo pipefail
          ./scripts/build-apt-repo.sh \
            --debs debs \
            --out repo \
            --sign "${{ secrets.APT_GPG_KEY_ID }}"
      - name: Publish the pool
        # Packages before indices, always. An index that names a .deb the store
        # does not have yet is a hard failure for anyone who runs `apt upgrade`
        # in the window between the two syncs; the reverse order is merely stale.
        # No --delete: the pool only ever grows.
        run: |
          set -euo pipefail
          aws s3 sync repo/pool "s3://${BUCKET}/pool" \
            --cache-control "public, max-age=31536000, immutable"
      - name: Publish the indices
        # --delete here because the indices are regenerated wholesale and a
        # dropped architecture should stop being advertised.
        run: |
          set -euo pipefail
          aws s3 sync repo/dists "s3://${BUCKET}/dists" --delete \
            --cache-control "public, max-age=300"
