name: publish
on:
  push:
    tags:
    - 'v*.*.*'
  # Rebuild and upload binaries for an existing release without re-tagging —
  # for when a binary job fails after the crates.io publish and GitHub
  # release have already succeeded.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build binaries for (e.g. v0.16.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Publishes mtrack to crates.io.
  publish:
    name: Publish to crates.io
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    # A tag whose version was never bumped in Cargo.toml used to fail only at
    # `cargo publish` ("version already uploaded") — after the GitHub release
    # already existed. Fail the whole pipeline up front instead.
    - name: Verify tag matches crate version
      run: |
        CRATE_VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
        if [ "v${CRATE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
          echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CRATE_VERSION}." >&2
          echo "Bump the version (and Cargo.lock) before tagging." >&2
          exit 1
        fi
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config libssl-dev protobuf-compiler
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Cache node modules
      uses: actions/cache@v5
      with:
        path: src/webui/svelte/node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: node-modules-${{ runner.os }}-
    - name: Build frontend
      run: make build-ui
    - name: Run publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: cargo publish --locked --allow-dirty

  # Creates a release on Github. Gated on the crates.io publish so a bad tag
  # (wrong version, packaging failure) doesn't leave a half-made release to
  # clean up.
  release:
    name: Create a GitHub release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Extract release notes
        id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.extract-release-notes.outputs.release_notes }}
        run: gh release create --notes "$RELEASE_NOTES" --title "${{ github.ref_name }}" "${{ github.ref_name }}"

  # Builds release binaries for each supported platform and uploads them to the
  # GitHub release. Linux binaries are built on the oldest supported Ubuntu LTS
  # so the resulting glibc-linked binary runs on newer distros as well.
  build-binaries:
    name: Build binary (${{ matrix.target }})
    needs: release
    # On a tag push this still requires the release to exist; on a manual
    # dispatch the release already exists and the skipped needs is fine.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            platform: linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            platform: linux
          - target: x86_64-apple-darwin
            os: macos-14
            platform: macos
          - target: aarch64-apple-darwin
            os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Linux system dependencies
        # protoc comes from setup-protoc below, not apt: ubuntu-22.04 ships
        # protoc 3.12, which rejects the proto3 optional fields our protos
        # use ("--experimental_allow_proto3_optional was not set") — the
        # failure that broke the v0.16.0 Linux binaries.
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config libssl-dev
      - name: Install protoc
        if: matrix.platform == 'linux'
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install macOS system dependencies
        if: matrix.platform == 'macos'
        run: brew install pkg-config protobuf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v5
        with:
          path: src/webui/svelte/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: node-modules-${{ runner.os }}-
      - name: Build frontend
        run: make build-ui
      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          STAGE="mtrack-${VERSION}-${{ matrix.target }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/mtrack" "$STAGE/"
          cp README.md LICENSE CHANGELOG.md "$STAGE/"
          tar czf "${STAGE}.tar.gz" "$STAGE"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          else
            shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          fi
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG}" mtrack-*.tar.gz mtrack-*.tar.gz.sha256 --clobber
